name: Apply async Matrix store restore fix

on:
  push:
    paths:
      - .github/workflows/apply-restore-login-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move blocking nio store restore off the event loop
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/matrix_extended/client.py')
          text = path.read_text()

          old_init = """        self._client.restore_login(\n            user_id=user_id,\n            device_id=device_id,\n            access_token=access_token,\n        )\n        self._room_cache: dict[str, str] = {}\n"""
          new_init = """        self._login_user_id = user_id\n        self._login_device_id = device_id\n        self._login_access_token = access_token\n        self._login_restored = False\n        self._room_cache: dict[str, str] = {}\n"""
          assert old_init in text, 'expected restore_login constructor block not found'
          text = text.replace(old_init, new_init, 1)

          old_connect = """    async def async_connect(self, default_room: str | None = None) -> bool | None:\n        \"\"\"Verify login, load room state, and initialize E2EE keys.\"\"\"\n        try:\n            response = await self._client.whoami()\n"""
          new_connect = """    async def async_connect(self, default_room: str | None = None) -> bool | None:\n        \"\"\"Verify login, load room state, and initialize E2EE keys.\"\"\"\n        if not self._login_restored:\n            await asyncio.to_thread(\n                self._client.restore_login,\n                user_id=self._login_user_id,\n                device_id=self._login_device_id,\n                access_token=self._login_access_token,\n            )\n            self._login_restored = True\n        try:\n            response = await self._client.whoami()\n"""
          assert old_connect in text, 'expected async_connect block not found'
          path.write_text(text.replace(old_connect, new_connect, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-restore-login-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/matrix_extended/client.py .github/workflows/apply-restore-login-fix.yml
          git commit -m "fix: move Matrix store restore off event loop"
          git push
