name: Apply Matrix timeout policy fix

on:
  push:
    paths:
      - .github/workflows/apply-timeout-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded nio timeout retries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/matrix_extended/client.py')
          text = path.read_text()
          old = """        config = AsyncClientConfig(\n            encryption_enabled=True,\n            store_sync_tokens=True,\n            pickle_key=store_key,\n        )\n"""
          new = """        config = AsyncClientConfig(\n            encryption_enabled=True,\n            store_sync_tokens=True,\n            pickle_key=store_key,\n            max_timeouts=0,\n        )\n"""
          assert old in text, 'expected AsyncClientConfig block not found'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-timeout-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/matrix_extended/client.py .github/workflows/apply-timeout-fix.yml
          git commit -m "fix: surface Matrix transport disconnects"
          git push
