name: Capture Android Matrix screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - docs/v050-screenshots
    paths:
      - .github/workflows/capture-android.yml
      - ci/maestro/**
      - ci/scripts/capture-element-x.sh
      - ci/scripts/prepare-doc-media.sh
      - ci/scripts/send-doc-messages.py
      - ci/scripts/capture-docs.py
      - custom_components/matrix_extended/**

permissions:
  contents: write

jobs:
  capture:
    name: Real Element X Android screenshots
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate disposable Synapse config
        run: ci/scripts/prepare-synapse.sh

      - name: Start Synapse 1.160.0
        run: |
          E2E_UID="$(id -u)" E2E_GID="$(id -g)" docker compose -f compose.test.yml up -d synapse

      - name: Wait for Matrix Client API
        run: python ci/scripts/wait-http.py http://127.0.0.1:8008/_matrix/client/versions 90

      - name: Bootstrap Matrix users and encrypted room
        run: |
          MATRIX_REGISTRATION_SHARED_SECRET="$(cat .ci/synapse-shared-secret)" \
            python ci/scripts/bootstrap-matrix.py

      - name: Prepare Home Assistant config
        run: ci/scripts/prepare-ha.sh

      - name: Install ffmpeg for documentation fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Generate image, video, and voice fixtures
        run: bash ci/scripts/prepare-doc-media.sh

      - name: Start Home Assistant 2026.9.2
        run: docker compose -f compose.test.yml up -d homeassistant

      - name: Wait for Home Assistant
        run: python ci/scripts/wait-http.py http://127.0.0.1:8123/api/onboarding 180

      - name: Configure Matrix Extended documentation fixture
        run: python ci/scripts/capture-docs.py setup

      - name: Download verified Element X Android v26.09.1
        run: |
          mkdir -p .ci
          curl -fL --retry 3 \
            -o .ci/element-x.apk \
            https://github.com/element-hq/element-x-android/releases/download/v26.09.1/app-fdroid-x86_64-release-signed.apk
          echo "dd913f14d8e25b980d2a4e8a3735dba997595fbfeb920fc8ca81dd9a154deda5  .ci/element-x.apk" | sha256sum -c -

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: Free runner disk for Android AVD
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Run Element X on Android emulator and capture messages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: bash ci/scripts/capture-element-x.sh

      - name: Upload Android screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-extended-element-x-screenshots
          path: docs/images/matrix-extended-element-x-*.png
          if-no-files-found: error
          compression-level: 0

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-extended-element-x-diagnostics
          path: .ci/android-debug
          if-no-files-found: warn

      - name: Commit Android screenshots to documentation branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/matrix-extended-element-x-*.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: capture Matrix Extended in Element X Android"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Stack diagnostics on failure
        if: failure()
        run: |
          docker compose -f compose.test.yml ps
          docker compose -f compose.test.yml logs --no-color --tail=200 homeassistant synapse

      - name: Stop disposable stack
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans
