name: Capture documentation screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - docs/v050-screenshots
    paths:
      - .github/workflows/capture-docs.yml
      - ci/scripts/capture-docs.py

permissions:
  contents: write

jobs:
  capture:
    name: Real Home Assistant UI screenshots
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate disposable Synapse config
        run: ci/scripts/prepare-synapse.sh
      - name: Start Synapse 1.160.0
        run: |
          E2E_UID="$(id -u)" E2E_GID="$(id -g)" docker compose -f compose.test.yml up -d synapse
      - name: Wait for Matrix Client API
        run: python ci/scripts/wait-http.py http://127.0.0.1:8008/_matrix/client/versions 90
      - name: Bootstrap Matrix users and encrypted room
        run: |
          MATRIX_REGISTRATION_SHARED_SECRET="$(cat .ci/synapse-shared-secret)" \
            python ci/scripts/bootstrap-matrix.py
      - name: Prepare Home Assistant config
        run: ci/scripts/prepare-ha.sh
      - name: Start Home Assistant 2026.9.2
        run: docker compose -f compose.test.yml up -d homeassistant
      - name: Wait for Home Assistant
        run: python ci/scripts/wait-http.py http://127.0.0.1:8123/api/onboarding 180
      - name: Configure documentation fixture
        run: python ci/scripts/capture-docs.py setup
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture real Home Assistant UI
        run: python ci/scripts/capture-docs.py capture
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrix-extended-docs-screenshots
          path: docs/images/matrix-extended-*.png
          if-no-files-found: error
          compression-level: 0
      - name: Commit screenshots to documentation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/matrix-extended-*.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: capture Matrix Extended Home Assistant UI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Stack diagnostics on failure
        if: failure()
        run: |
          docker compose -f compose.test.yml ps
          docker compose -f compose.test.yml logs --no-color --tail=200 homeassistant synapse
      - name: Stop disposable stack
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans
