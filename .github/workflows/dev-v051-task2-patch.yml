name: One-shot v051 task2 patch

on:
  push:
    branches:
      - feature/v051-safe-commands-assist
    paths:
      - .github/workflows/dev-v051-task2-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v051-safe-commands-assist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply assert-based patch
        run: python ci/scripts/dev-v051-task2-patch.py
      - name: Commit patch result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/matrix_extended/__init__.py custom_components/matrix_extended/services.yaml
          git diff --cached --quiet && exit 0
          git commit -m "feat: load and document safe command registry"
          git push origin HEAD:feature/v051-safe-commands-assist
