name: One-shot v051 task7 patch

on:
  push:
    branches:
      - feature/v051-safe-commands-assist
    paths:
      - ci/scripts/dev-v051-task7-patch.py
      - .github/workflows/dev-v051-task7-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v051-safe-commands-assist
      - name: Apply diagnostic wiring
        run: python ci/scripts/dev-v051-task7-patch.py
      - name: Commit patch
        run: |
          git config user.name "Psix-anp"
          git config user.email "77142468+Psix-anp@users.noreply.github.com"
          git add custom_components/matrix_extended/__init__.py custom_components/matrix_extended/v05_services.py custom_components/matrix_extended/receiver.py
          git diff --cached --quiet && exit 1
          git commit -m "feat: wire v051 diagnostic runtime status"
          git push
