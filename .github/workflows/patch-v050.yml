name: Patch v0.5 persistent reaction actions

on:
  push:
    branches:
      - feature/v050-persistent-reaction-actions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v050-persistent-reaction-actions
      - name: Apply exact persistence wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/matrix_extended/__init__.py')
          text = path.read_text()

          old = '''            if actions and account.action_registry:\n                for room, event_id in zip(prepared_rooms, event_ids, strict=True):\n                    if event_id:\n                        account.action_registry.register(\n                            room_id=room.room_id,\n                            event_id=event_id,\n                            actions=actions,\n                        )\n'''
          new = old + '''                await account.action_registry.async_save()\n'''
          assert text.count(old) == 1, 'send registry block did not match exactly once'
          text = text.replace(old, new, 1)

          old = '''    stored_notifications = await notification_store.async_load() or {}\n    notification_registry = NotificationKeyRegistry(stored_notifications)\n    rooms = client.rooms_snapshot()\n'''
          new = '''    stored_notifications = await notification_store.async_load() or {}\n    notification_registry = NotificationKeyRegistry(stored_notifications)\n    action_store: Store[dict[str, Any]] = Store(\n        hass, 1, f"{DOMAIN}.reaction_actions_{entry.entry_id}", private=True\n    )\n    stored_actions = await action_store.async_load() or {}\n    action_registry = ReactionActionRegistry(stored_actions, store=action_store)\n    rooms = client.rooms_snapshot()\n'''
          assert text.count(old) == 1, 'setup store block did not match exactly once'
          text = text.replace(old, new, 1)

          old = '        action_registry=ReactionActionRegistry(),\n'
          new = '        action_registry=action_registry,\n'
          assert text.count(old) == 1, 'account registry assignment did not match exactly once'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          rm .github/workflows/patch-v050.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/matrix_extended/__init__.py .github/workflows/patch-v050.yml
          git diff --cached --check
          git commit -m 'feat: persist reaction actions through Home Assistant Store'
          git push origin HEAD:feature/v050-persistent-reaction-actions
