name: One-shot stale branch cleanup

on:
  push:
    branches:
      - chore/repository-hygiene

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches and keep only active work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t open_pr_heads < <(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json headRefName \
              --jq '.[].headRefName'
          )

          keep_branch() {
            local branch="$1"
            if [[ "$branch" == "main" || "$branch" == "chore/repository-hygiene" ]]; then
              return 0
            fi
            local head
            for head in "${open_pr_heads[@]}"; do
              if [[ "$branch" == "$head" ]]; then
                return 0
              fi
            done
            return 1
          }

          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            if keep_branch "$branch"; then
              echo "KEEP   $branch"
              continue
            fi

            echo "DELETE $branch"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
