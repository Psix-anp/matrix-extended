name: Matrix Extended tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast:
    name: Fast regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Validate source tree
        run: python ci/scripts/validate-source.py
      - name: Compile integration
        run: python -m compileall -q custom_components/matrix_extended
      - name: Run regression suite
        run: pytest -q

  real_stack:
    name: Real HA 2026.9.2 + Synapse 1.160.0 + Element 1.12.26
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate disposable Synapse config
        run: ci/scripts/prepare-synapse.sh
      - name: Start Synapse 1.160.0
        run: |
          E2E_UID="$(id -u)" E2E_GID="$(id -g)" docker compose -f compose.test.yml up -d synapse
      - name: Wait for Matrix Client API
        run: python ci/scripts/wait-http.py http://127.0.0.1:8008/_matrix/client/versions 90
      - name: Bootstrap Matrix users and encrypted room
        run: |
          MATRIX_REGISTRATION_SHARED_SECRET="$(cat .ci/synapse-shared-secret)" \
            python ci/scripts/bootstrap-matrix.py
      - name: Verify Matrix bootstrap contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.ci/matrix-env.json')
          s = Path('.ci/matrix-passwords.json')
          data = json.loads(p.read_text())
          assert set(data) == {
              'homeserver', 'bot_user_id', 'bot_access_token',
              'user_user_id', 'user_access_token', 'room_id', 'room_alias',
          }
          assert data['homeserver'] == 'http://127.0.0.1:8008'
          assert data['room_id'].startswith('!')
          assert data['room_alias'] == '#matrix-extended-e2e:matrix.test'
          assert p.stat().st_mode & 0o777 == 0o600
          assert s.stat().st_mode & 0o777 == 0o600
          print('Matrix bootstrap contract verified')
          PY
      - name: Install Chromium UI test dependencies
        run: |
          python -m pip install playwright==1.62.0 "matrix-nio[e2e]==0.26.0"
          python -m playwright install --with-deps chromium
      - name: Start Element Web 1.12.26
        run: docker compose -f compose.test.yml up -d --no-deps element
      - name: Wait for Element Web
        run: python ci/scripts/wait-http.py http://127.0.0.1:8080/config.json 90
      - name: Login Element recipient before HA sends E2EE data
        run: python ci/scripts/element-e2e.py login
      - name: Prepare Home Assistant config
        run: ci/scripts/prepare-ha.sh
      - name: Start Home Assistant 2026.9.2
        run: docker compose -f compose.test.yml up -d homeassistant
      - name: Wait for Home Assistant onboarding API
        run: python ci/scripts/wait-http.py http://127.0.0.1:8123/api/onboarding 180
      - name: Validate Matrix services metadata with Home Assistant parser
        run: |
          docker compose -f compose.test.yml exec -T homeassistant python - <<'PY'
          from homeassistant.helpers.service import _SERVICES_SCHEMA
          from homeassistant.util.yaml import load_yaml_dict

          path = "/config/custom_components/matrix_extended/services.yaml"
          data = load_yaml_dict(path)
          parsed = _SERVICES_SCHEMA(data)
          assert "transcribe_voice" in parsed
          print("Matrix services.yaml validated by Home Assistant")
          PY
      - name: Configure Matrix Extended and verify encrypted send + reload
        run: python ci/scripts/ha-e2e.py setup-send-reload
      - name: Verify Element decrypts text and renders rich Matrix events
        run: python ci/scripts/element-e2e.py verify-message-rich
      - name: Verify encrypted safe commands and automatic voice Assist
        run: python ci/scripts/matrix-command-e2e.py
      - name: Arm persistent outbox verification
        run: python ci/scripts/ha-reconnect.py arm-outbox
      - name: Stop Synapse while Home Assistant stays running
        run: docker compose -f compose.test.yml stop synapse
      - name: Verify Home Assistant observes the Matrix outage
        run: python ci/scripts/ha-reconnect.py wait-disconnected
      - name: Queue Matrix send while Synapse is unavailable
        run: python ci/scripts/ha-reconnect.py queue-outbox
      - name: Start Synapse again
        run: docker compose -f compose.test.yml start synapse
      - name: Wait for Matrix Client API after Synapse restart
        run: python ci/scripts/wait-http.py http://127.0.0.1:8008/_matrix/client/versions 90
      - name: Verify queued delivery, inbound listener, and encrypted outbound recovery without HA reload
        run: python ci/scripts/ha-reconnect.py verify-reconnect
      - name: Restart Home Assistant
        run: docker compose -f compose.test.yml restart homeassistant
      - name: Wait for Home Assistant after restart
        run: python ci/scripts/wait-http.py http://127.0.0.1:8123/api/onboarding 180
      - name: Verify config entry after Home Assistant restart
        run: python ci/scripts/ha-e2e.py verify-restart
      - name: Verify Matrix Extended did not block or leak background tasks
        run: |
          docker compose -f compose.test.yml logs --no-color homeassistant > .ci/home-assistant.log
          python ci/scripts/assert-clean-ha-log.py .ci/home-assistant.log
      - name: Upload Element screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-element-e2e-screenshots
          path: .ci/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Stack diagnostics on failure
        if: failure()
        run: |
          mkdir -p .ci
          docker compose -f compose.test.yml ps | tee .ci/failure-stack.log
          docker compose -f compose.test.yml logs --no-color --tail=500 homeassistant synapse element | tee -a .ci/failure-stack.log
      - name: Upload stack diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-real-stack-failure-diagnostics
          path: .ci/failure-stack.log
          if-no-files-found: error
          retention-days: 14
      - name: Stop real stack
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans

  package:
    name: Verified install ZIP
    needs:
      - fast
      - real_stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and verify install archive
        id: release
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/matrix_extended/manifest.json"))["version"])')"
          python ci/scripts/build-release.py
          sha256sum "dist/matrix_extended-ha-install-v${version}.zip" > "dist/matrix_extended-ha-install-v${version}.zip.sha256"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Upload verified install archive
        uses: actions/upload-artifact@v4
        with:
          name: matrix_extended-ha-install-v${{ steps.release.outputs.version }}
          path: |
            dist/matrix_extended-ha-install-v${{ steps.release.outputs.version }}.zip
            dist/matrix_extended-ha-install-v${{ steps.release.outputs.version }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
