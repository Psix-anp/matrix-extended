send:
  name: Send Matrix message
  description: Send text and rich media to one or more Matrix rooms. Supports E2EE, Markdown, native mentions, threads, updateable notifications, reaction actions and optional delivery response data. The graphical editor covers common and advanced fields; YAML remains fully supported.
  fields:
    account:
      name: Account
      description: Matrix Extended configuration entry. Omit in YAML only when exactly one account is loaded.
      selector:
        config_entry:
          integration: matrix_extended
    target:
      name: Rooms
      description: Matrix room aliases or IDs. Omit to use the configured default room.
      selector:
        text:
          multiple: true
    route:
      name: Route
      description: Named routing profile configured in Matrix Extended settings. Cannot be used together with Rooms.
      selector:
        text: {}
    notification_key:
      name: Notification key
      description: Stable key for an updateable notification; later sends edit the original event instead of creating a new one.
      selector:
        text: {}
    message:
      name: Message
      description: Text body. Can be empty when only media is sent.
      selector:
        text:
          multiline: true
    msgtype:
      name: Message type
      default: text
      selector:
        select:
          options: [text, notice, emote]
          translation_key: message_type
    format:
      name: Format
      default: text
      selector:
        select:
          options: [text, html, markdown]
          translation_key: message_format
    mention_users:
      name: Mention users
      description: Matrix user IDs added to native m.mentions metadata.
      selector:
        text:
          multiple: true
    mention_room:
      name: Mention room
      description: Add a native room-wide Matrix mention.
      default: false
      selector:
        boolean: {}
    thread_id:
      name: Thread ID
      description: Matrix event ID of the thread root.
      selector:
        text: {}
    media:
      name: Advanced media
      description: One or more media attachments. Use Send Matrix media for the Home Assistant Media Browser; use this structured form for cameras, local paths, URLs and advanced metadata.
      selector:
        object:
          multiple: true
          label_field: filename
          description_field: caption
          fields:
            entity_id:
              label: Home Assistant entity
              selector:
                entity: {}
            path:
              label: Local path
              selector:
                text: {}
            url:
              label: URL
              selector:
                text:
                  type: url
            media_source:
              label: Media Source ID
              selector:
                text: {}
            type:
              label: Media type
              selector:
                select:
                  options: [auto, image, video, audio, file]
            filename:
              label: File name
              selector:
                text: {}
            caption:
              label: Caption
              selector:
                text:
                  multiline: true
            formatted_caption:
              label: Formatted caption
              selector:
                text:
                  multiline: true
            width:
              label: Width
              selector:
                number:
                  min: 1
                  mode: box
            height:
              label: Height
              selector:
                number:
                  min: 1
                  mode: box
            duration_ms:
              label: Duration, ms
              selector:
                number:
                  min: 0
                  mode: box
            voice:
              label: Native voice message
              selector:
                boolean: {}
    actions:
      name: Reaction actions
      description: Explicit Home Assistant service calls bound to reactions on this outgoing Matrix event. They are allowlisted and can expire or be limited by use count.
      selector:
        object:
          multiple: true
          label_field: reaction
          description_field: service
          fields:
            reaction:
              label: Reaction
              required: true
              selector:
                text: {}
            service:
              label: Home Assistant action
              required: true
              selector:
                text: {}
            target:
              label: Target
              selector:
                target: {}
            data:
              label: Action data
              selector:
                object: {}
            expires_in:
              label: Expires after, seconds
              selector:
                number:
                  min: 1
                  max: 604800
                  mode: box
            max_uses:
              label: Maximum uses
              selector:
                number:
                  min: 1
                  max: 100
                  mode: box
            allowed_users:
              label: Allowed Matrix users
              selector:
                text:
                  multiple: true

send_media:
  name: Send Matrix media
  description: Choose one media item graphically from any Home Assistant Media Source provider, including Frigate and Local Media, and send it to Matrix. YAML can still provide the same fields manually.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended
    target:
      name: Rooms
      description: Matrix room aliases or IDs. Omit to use the default room.
      selector:
        text:
          multiple: true
    route:
      name: Route
      description: Named routing profile. Cannot be used together with Rooms.
      selector:
        text: {}
    media_picker:
      name: Choose media
      description: Open the Home Assistant Media Browser. All Media Source types are accepted so providers such as Frigate are not filtered out.
      required: true
      selector:
        media:
          accept:
            - "*"
    caption:
      name: Caption
      description: Optional Matrix caption for the selected media.
      selector:
        text:
          multiline: true
    voice:
      name: Voice message
      description: Mark selected audio as a native Matrix voice message.
      default: false
      selector:
        boolean: {}
    thread_id:
      name: Thread ID
      description: Matrix event ID of the thread root.
      selector:
        text: {}

send_voice:
  name: Send Matrix voice message
  description: Convert text with a Home Assistant TTS entity and send the generated audio as a native Matrix voice message. Locale variants are matched to languages supported by the selected TTS provider.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended
    target:
      name: Rooms
      selector:
        text:
          multiple: true
    route:
      name: Route
      selector:
        text: {}
    text:
      name: Text
      required: true
      selector:
        text:
          multiline: true
    tts_engine:
      name: TTS engine
      description: Home Assistant tts.* entity. Leave empty to use the default TTS engine. YAML may still supply a compatible provider ID.
      selector:
        entity:
          domain: tts
    language:
      name: Language
      description: Language requested from the TTS provider. Matrix Extended will match a locale such as ru-RU to ru when appropriate.
      selector:
        language: {}
    tts_options:
      name: TTS options
      description: Provider-specific options such as voice selection. This remains an advanced YAML/object field because providers define different keys.
      selector:
        object: {}
    thread_id:
      name: Thread ID
      selector:
        text: {}

transcribe_voice:
  name: Transcribe Matrix voice
  description: Transcribe a downloaded Matrix voice file through Home Assistant STT. If necessary, Home Assistant FFmpeg normalizes the audio. Assist processing is explicit and disabled by default.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended
    path:
      name: Incoming voice path
      description: local_path from a matrix_extended_media event, or a filename relative to this account's incoming-media directory.
      required: true
      selector:
        text: {}
    stt_entity:
      name: STT entity
      description: Home Assistant stt.* entity. Leave empty to use the default STT entity.
      selector:
        entity:
          domain: stt
    language:
      name: Language
      description: Language requested from the STT provider. Defaults to the Home Assistant language.
      selector:
        language: {}
    audio_format:
      name: Input audio format
      default: ogg
      selector:
        select:
          options: [ogg, wav]
          translation_key: audio_format
    codec:
      name: Input codec
      default: opus
      selector:
        select:
          options: [opus, pcm]
          translation_key: audio_codec
    bit_rate:
      name: Input bit depth
      default: "16"
      selector:
        select:
          options: ["8", "16", "24", "32"]
    sample_rate:
      name: Input sample rate
      default: "48000"
      selector:
        select:
          options: ["8000", "11000", "16000", "18900", "22000", "32000", "37800", "44100", "48000"]
    channels:
      name: Input channels
      default: "1"
      selector:
        select:
          options: ["1", "2"]
    assist:
      name: Run Home Assistant Assist
      description: Explicit opt-in. When enabled, the transcript is passed to Home Assistant Conversation/Assist.
      default: false
      selector:
        boolean: {}
    conversation_agent:
      name: Conversation agent
      description: Optional conversation.* agent used when Assist is enabled.
      selector:
        entity:
          domain: conversation
    conversation_id:
      name: Conversation ID
      description: Optional existing Home Assistant conversation ID.
      selector:
        text: {}

send_location:
  name: Send Matrix location
  description: Send stable Matrix location data from explicit coordinates or a Home Assistant entity exposing latitude and longitude attributes.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended
    target:
      name: Rooms
      selector:
        text:
          multiple: true
    route:
      name: Route
      selector:
        text: {}
    entity_id:
      name: Location entity
      description: person, device_tracker, or another entity with latitude and longitude attributes. Use this or explicit coordinates.
      selector:
        entity: {}
    latitude:
      name: Latitude
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      name: Longitude
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    description:
      name: Description
      selector:
        text: {}
    thread_id:
      name: Thread ID
      selector:
        text: {}

reply:
  name: Reply to Matrix event
  description: Send a rich reply to an existing Matrix event. Use the event ID from an incoming Matrix Extended event or a previous delivery response.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended
    room:
      name: Room
      description: Matrix room alias or ID. Omit to use the default room.
      selector:
        text: {}
    event_id:
      name: Event ID
      required: true
      selector:
        text: {}
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true
    msgtype:
      name: Message type
      default: text
      selector:
        select:
          options: [text, notice, emote]
          translation_key: message_type
    format:
      name: Format
      default: text
      selector:
        select:
          options: [text, html, markdown]
          translation_key: message_format
    mention_users:
      name: Mention users
      selector:
        text:
          multiple: true
    mention_room:
      name: Mention room
      default: false
      selector:
        boolean: {}
    thread_id:
      name: Thread ID
      selector:
        text: {}

react:
  name: React to Matrix event
  description: Add an emoji reaction to an existing Matrix event. Matrix reactions themselves are sent as m.reaction events.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended
    room:
      name: Room
      description: Matrix room alias or ID. Omit to use the default room.
      selector:
        text: {}
    event_id:
      name: Event ID
      required: true
      selector:
        text: {}
    reaction:
      name: Reaction
      description: Emoji or text reaction key, for example ✅.
      required: true
      selector:
        text: {}

edit:
  name: Edit Matrix message
  description: Replace a previously sent text-like Matrix message using m.replace.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended
    room:
      name: Room
      description: Matrix room alias or ID. Omit to use the default room.
      selector:
        text: {}
    event_id:
      name: Event ID
      required: true
      selector:
        text: {}
    message:
      name: New message
      required: true
      selector:
        text:
          multiline: true
    msgtype:
      name: Message type
      default: text
      selector:
        select:
          options: [text, notice, emote]
          translation_key: message_type
    format:
      name: Format
      default: text
      selector:
        select:
          options: [text, html, markdown]
          translation_key: message_format

redact:
  name: Redact Matrix event
  description: Redact an existing Matrix event. This is Matrix redaction, not a local Home Assistant delete.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended
    room:
      name: Room
      description: Matrix room alias or ID. Omit to use the default room.
      selector:
        text: {}
    event_id:
      name: Event ID
      required: true
      selector:
        text: {}
    reason:
      name: Reason
      selector:
        text: {}

purge_media:
  name: Purge downloaded Matrix media
  description: Delete downloaded incoming Matrix media for one Matrix Extended account. Returns removed file and byte counts when response data is requested.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended

register_command:
  name: Register safe Matrix command
  description: Register or replace one exact Matrix command. Incoming Matrix text can select only this stored command and cannot override its Home Assistant service, target, data, or camera entity.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended
    id:
      name: Command ID
      required: true
      selector:
        text: {}
    trigger:
      name: Trigger
      description: Exact normalized phrase without the leading exclamation mark, for example garage open.
      required: true
      selector:
        text: {}
    aliases:
      name: Aliases
      selector:
        text:
          multiple: true
    description:
      name: Description
      selector:
        text: {}
    allowed_users:
      name: Allowed users
      description: Optional users that further narrow the account allowlist.
      selector:
        text:
          multiple: true
    allowed_rooms:
      name: Allowed rooms
      description: Optional rooms that further narrow the account allowlist.
      selector:
        text:
          multiple: true
    progress:
      name: Progress reply
      default: true
      selector:
        boolean: {}
    handler_type:
      name: Handler type
      required: true
      selector:
        select:
          options: [service, camera_snapshot]
    service:
      name: Home Assistant service
      description: Required only for service handlers.
      selector:
        text: {}
    target:
      name: Stored service target
      description: Never derived from incoming Matrix text.
      selector:
        object: {}
    data:
      name: Stored service data
      description: Never derived from incoming Matrix text.
      selector:
        object: {}
    entity_id:
      name: Camera entity
      description: Required only for camera_snapshot and must be camera.*.
      selector:
        entity:
          domain: camera
    caption:
      name: Camera caption
      selector:
        text: {}

unregister_command:
  name: Unregister safe Matrix command
  description: Remove one registered Matrix command by stable ID.
  fields:
    account:
      name: Account
      selector:
        config_entry:
          integration: matrix_extended
    id:
      name: Command ID
      required: true
      selector:
        text: {}
