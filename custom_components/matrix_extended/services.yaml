send:
  name: Send Matrix message
  description: Send text and rich media to one or more Matrix rooms. Supports E2EE, Markdown, native mentions, threads, updateable notifications, reaction actions and optional delivery response data.
  fields:
    account:
      name: Account
      description: Config entry ID. Omit when only one Matrix Extended account is loaded.
      selector: {text: {}}
    target:
      name: Rooms
      description: Matrix room aliases or IDs. Omit to use the configured default room.
      selector:
        text: {multiple: true}
    route:
      name: Route
      description: Named routing profile. Cannot be used together with Rooms.
      selector: {text: {}}
    notification_key:
      name: Notification key
      description: Stable key for an updateable notification; later sends edit the original event.
      selector: {text: {}}
    message:
      name: Message
      selector:
        text: {multiline: true}
    msgtype:
      name: Message type
      default: text
      selector:
        select: {options: [text, notice, emote]}
    format:
      name: Format
      default: text
      selector:
        select: {options: [text, html, markdown]}
    mention_users:
      name: Mention users
      description: Matrix user IDs added to native m.mentions metadata.
      selector:
        text: {multiple: true}
    mention_room:
      name: Mention room
      default: false
      selector: {boolean: {}}
    thread_id:
      name: Thread ID
      selector: {text: {}}
    media:
      name: Media
      description: Media objects using entity_id, path, url, or media_source. Set voice=true on audio to send a native Matrix voice marker.
      selector: {object: {}}
    actions:
      name: Reaction actions
      description: Explicit HA service calls bound to reactions. Supports expires_in, max_uses and allowed_users.
      selector: {object: {}}

send_voice:
  name: Send Matrix voice message
  description: Convert text with Home Assistant TTS and send the generated audio as a native Matrix voice message. Supports E2EE, routes and threads.
  fields:
    account:
      name: Account
      selector: {text: {}}
    target:
      name: Rooms
      selector:
        text: {multiple: true}
    route:
      name: Route
      selector: {text: {}}
    text:
      name: Text
      required: true
      selector:
        text: {multiline: true}
    tts_engine:
      name: TTS engine
      description: Optional Home Assistant TTS provider/entity. Omit to use the default engine.
      selector: {text: {}}
    language:
      name: Language
      description: Optional language code such as ru-RU.
      selector: {text: {}}
    tts_options:
      name: TTS options
      description: Provider-specific Home Assistant TTS options, for example a voice selection.
      selector: {object: {}}
    thread_id:
      name: Thread ID
      selector: {text: {}}

transcribe_voice:
  name: Transcribe Matrix voice
  description: Transcribe a downloaded Matrix voice file through a Home Assistant STT entity. Files are restricted to this Matrix account's incoming-media directory. If the provider only accepts WAV/PCM, audio is normalized with Home Assistant FFmpeg. Assist execution is explicit and disabled by default.
  fields:
    account:
      name: Account
      selector: {text: {}}
    path:
      name: Incoming voice path
      description: local_path from a matrix_extended_media event, or a filename relative to this account's incoming Matrix directory.
      required: true
      selector: {text: {}}
    stt_entity:
      name: STT entity
      description: Home Assistant stt.* entity. Omit to use the default STT entity.
      selector:
        entity: {domain: stt}
    language:
      name: Language
      description: Language requested from the STT provider. Defaults to the Home Assistant language.
      selector: {text: {}}
    audio_format:
      name: Input audio format
      default: ogg
      selector:
        select: {options: [ogg, wav]}
    codec:
      name: Input codec
      default: opus
      selector:
        select: {options: [opus, pcm]}
    bit_rate:
      name: Input bit depth
      default: "16"
      selector:
        select: {options: ["8", "16", "24", "32"]}
    sample_rate:
      name: Input sample rate
      default: "48000"
      selector:
        select: {options: ["8000", "11000", "16000", "18900", "22000", "32000", "37800", "44100", "48000"]}
    channels:
      name: Input channels
      default: "1"
      selector:
        select: {options: ["1", "2"]}
    assist:
      name: Run Home Assistant Assist
      description: Explicit opt-in. When enabled, the transcript is passed to Home Assistant Conversation/Assist.
      default: false
      selector: {boolean: {}}
    conversation_agent:
      name: Conversation agent
      description: Optional conversation.* agent used when Assist is enabled.
      selector:
        entity: {domain: conversation}
    conversation_id:
      name: Conversation ID
      description: Optional existing Home Assistant conversation ID.
      selector: {text: {}}

send_location:
  name: Send Matrix location
  description: Send stable m.location from explicit coordinates or a Home Assistant entity exposing latitude and longitude attributes. Supports E2EE, routes and threads.
  fields:
    account:
      name: Account
      selector: {text: {}}
    target:
      name: Rooms
      selector:
        text: {multiple: true}
    route:
      name: Route
      selector: {text: {}}
    entity_id:
      name: Location entity
      description: person/device_tracker/other entity with latitude and longitude attributes. Use this or explicit coordinates.
      selector: {entity: {}}
    latitude:
      name: Latitude
      selector:
        number: {min: -90, max: 90, step: any, mode: box}
    longitude:
      name: Longitude
      selector:
        number: {min: -180, max: 180, step: any, mode: box}
    description:
      name: Description
      selector: {text: {}}
    thread_id:
      name: Thread ID
      selector: {text: {}}

reply:
  name: Reply to Matrix event
  description: Send a rich reply to an existing Matrix event.
  fields:
    account: {name: Account, selector: {text: {}}}
    room: {name: Room, selector: {text: {}}}
    event_id: {name: Event ID, required: true, selector: {text: {}}}
    message:
      name: Message
      required: true
      selector:
        text: {multiline: true}
    msgtype:
      name: Message type
      default: text
      selector:
        select: {options: [text, notice, emote]}
    format:
      name: Format
      default: text
      selector:
        select: {options: [text, html, markdown]}
    mention_users:
      name: Mention users
      selector:
        text: {multiple: true}
    mention_room: {name: Mention room, default: false, selector: {boolean: {}}}
    thread_id: {name: Thread ID, selector: {text: {}}}

react:
  name: React to Matrix event
  description: Add an emoji reaction. matrix-nio sends m.reaction unencrypted even in E2EE rooms.
  fields:
    account: {name: Account, selector: {text: {}}}
    room: {name: Room, selector: {text: {}}}
    event_id: {name: Event ID, required: true, selector: {text: {}}}
    reaction: {name: Reaction, required: true, selector: {text: {}}}

edit:
  name: Edit Matrix message
  description: Replace a previously sent text-like message using m.replace.
  fields:
    account: {name: Account, selector: {text: {}}}
    room: {name: Room, selector: {text: {}}}
    event_id: {name: Event ID, required: true, selector: {text: {}}}
    message:
      name: New message
      required: true
      selector:
        text: {multiline: true}
    msgtype:
      name: Message type
      default: text
      selector:
        select: {options: [text, notice, emote]}
    format:
      name: Format
      default: text
      selector:
        select: {options: [text, html, markdown]}

redact:
  name: Redact Matrix event
  description: Redact an event from a Matrix room.
  fields:
    account: {name: Account, selector: {text: {}}}
    room: {name: Room, selector: {text: {}}}
    event_id: {name: Event ID, required: true, selector: {text: {}}}
    reason: {name: Reason, selector: {text: {}}}

purge_media:
  name: Purge downloaded Matrix media
  description: Delete downloaded incoming media for one Matrix Extended account. Returns removed_files and removed_bytes when response data is requested.
  fields:
    account:
      name: Account
      selector: {text: {}}

register_command:
  name: Register safe Matrix command
  description: Register or replace one exact Matrix command. Incoming Matrix text can select only this stored command and cannot override its Home Assistant service, target, data, or camera entity.
  fields:
    account: {name: Account, selector: {text: {}}}
    id: {name: Command ID, required: true, selector: {text: {}}}
    trigger:
      name: Trigger
      description: Exact normalized phrase without the leading exclamation mark, for example garage open.
      required: true
      selector: {text: {}}
    aliases:
      name: Aliases
      selector: {text: {multiple: true}}
    description: {name: Description, selector: {text: {}}}
    allowed_users:
      name: Allowed users
      description: Optional users that further narrow the account allowlist.
      selector: {text: {multiple: true}}
    allowed_rooms:
      name: Allowed rooms
      description: Optional rooms that further narrow the account allowlist.
      selector: {text: {multiple: true}}
    progress: {name: Progress reply, default: true, selector: {boolean: {}}}
    handler_type:
      name: Handler type
      required: true
      selector: {select: {options: [service, camera_snapshot]}}
    service:
      name: Home Assistant service
      description: Required only for service handlers.
      selector: {text: {}}
    target:
      name: Stored service target
      description: Never derived from incoming Matrix text.
      selector: {object: {}}
    data:
      name: Stored service data
      description: Never derived from incoming Matrix text.
      selector: {object: {}}
    entity_id:
      name: Camera entity
      description: Required only for camera_snapshot and must be camera.*.
      selector: {entity: {domain: camera}}
    caption: {name: Camera caption, selector: {text: {}}}

unregister_command:
  name: Unregister safe Matrix command
  description: Remove one registered Matrix command by stable ID.
  fields:
    account: {name: Account, selector: {text: {}}}
    id: {name: Command ID, required: true, selector: {text: {}}}
