send:
  name: Send Matrix message
  description: Send text and rich media to one or more Matrix rooms. Encrypted rooms use Matrix E2EE, including encrypted media uploads. Supports optional service response data with delivery status and event IDs.
  fields:
    account:
      name: Account
      description: Config entry ID. Omit when only one Matrix Extended account is loaded.
      selector:
        text:
    target:
      name: Rooms
      description: Matrix room aliases or IDs. Omit to use the configured default room.
      selector:
        text:
          multiple: true
    route:
      name: Route
      description: Named routing profile configured in Matrix Extended options. Cannot be used together with Rooms.
      selector:
        text:
    notification_key:
      name: Notification key
      description: Stable key for an updateable text notification. The first send creates a message per room; later sends with the same key edit the original message.
      selector:
        text:
    message:
      name: Message
      selector:
        text:
          multiline: true
    msgtype:
      name: Message type
      description: Matrix text-like message type.
      default: text
      selector:
        select:
          options: [text, notice, emote]
    format:
      name: Format
      default: text
      selector:
        select:
          options: [text, html, markdown]
    mention_users:
      name: Mention users
      description: Matrix user IDs to include in native m.mentions metadata.
      selector:
        text:
          multiple: true
    mention_room:
      name: Mention room
      description: Set native m.mentions room=true.
      default: false
      selector:
        boolean:
    thread_id:
      name: Thread ID
      description: Optional Matrix event ID used as m.thread parent.
      selector:
        text:
    media:
      name: Media
      description: List of media objects using entity_id, path, url, or media_source. For audio, set voice: true to send a native Matrix voice message marker.
      selector:
        object:
    actions:
      name: Reaction actions
      description: Explicit Home Assistant service calls attached to reactions on this text event. Each object needs reaction and service; target/data are optional. v0.5 also supports expires_in (seconds), max_uses, and allowed_users.
      selector:
        object:

send_voice:
  name: Send Matrix voice message
  description: Convert text to speech using Home Assistant TTS and send the generated audio as a native Matrix voice message. E2EE, routes, threads, and optional service response data are supported.
  fields:
    account:
      name: Account
      description: Config entry ID. Omit when only one Matrix Extended account is loaded.
      selector:
        text:
    target:
      name: Rooms
      description: Matrix room aliases or IDs. Omit to use the configured default room.
      selector:
        text:
          multiple: true
    route:
      name: Route
      description: Named routing profile configured in Matrix Extended options. Cannot be used together with Rooms.
      selector:
        text:
    text:
      name: Text
      description: Text that Home Assistant TTS will synthesize.
      required: true
      selector:
        text:
          multiline: true
    tts_engine:
      name: TTS engine
      description: Optional Home Assistant TTS provider/entity. Omit to use the default engine.
      selector:
        text:
    language:
      name: Language
      description: Optional language code passed to the selected TTS engine, for example ru-RU.
      selector:
        text:
    tts_options:
      name: TTS options
      description: Optional provider-specific Home Assistant TTS options such as voice.
      selector:
        object:
    thread_id:
      name: Thread ID
      description: Optional Matrix event ID used as m.thread parent.
      selector:
        text:

send_location:
  name: Send Matrix location
  description: Send an m.location message from explicit coordinates or from a Home Assistant entity exposing latitude and longitude attributes. Supports E2EE rooms, routes, threads, and optional response data.
  fields:
    account:
      name: Account
      description: Config entry ID. Omit when only one Matrix Extended account is loaded.
      selector:
        text:
    target:
      name: Rooms
      description: Matrix room aliases or IDs. Omit to use the configured default room.
      selector:
        text:
          multiple: true
    route:
      name: Route
      description: Named routing profile configured in Matrix Extended options. Cannot be used together with Rooms.
      selector:
        text:
    entity_id:
      name: Location entity
      description: Optional person/device_tracker/other HA entity with latitude and longitude attributes. Use this or explicit coordinates.
      selector:
        entity:
    latitude:
      name: Latitude
      description: Explicit latitude from -90 to 90. Use together with longitude when entity_id is omitted.
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      name: Longitude
      description: Explicit longitude from -180 to 180. Use together with latitude when entity_id is omitted.
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    description:
      name: Description
      description: Location label shown in Matrix. Defaults to the entity friendly name or Location.
      selector:
        text:
    thread_id:
      name: Thread ID
      description: Optional Matrix event ID used as m.thread parent.
      selector:
        text:

reply:
  name: Reply to Matrix event
  description: Send a rich reply to an existing Matrix event.
  fields:
    account:
      name: Account
      selector:
        text:
    room:
      name: Room
      description: Room alias or ID. Omit to use the default room.
      selector:
        text:
    event_id:
      name: Event ID
      description: Matrix event being replied to.
      required: true
      selector:
        text:
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true
    msgtype:
      name: Message type
      default: text
      selector:
        select:
          options: [text, notice, emote]
    format:
      name: Format
      default: text
      selector:
        select:
          options: [text, html, markdown]
    mention_users:
      name: Mention users
      selector:
        text:
          multiple: true
    mention_room:
      name: Mention room
      default: false
      selector:
        boolean:
    thread_id:
      name: Thread ID
      selector:
        text:

react:
  name: React to Matrix event
  description: Add a Matrix emoji reaction. matrix-nio sends m.reaction unencrypted even in E2EE rooms; the relation and emoji are visible to the homeserver.
  fields:
    account:
      name: Account
      selector:
        text:
    room:
      name: Room
      selector:
        text:
    event_id:
      name: Event ID
      required: true
      selector:
        text:
    reaction:
      name: Reaction
      description: Emoji or reaction key.
      required: true
      selector:
        text:

edit:
  name: Edit Matrix message
  description: Replace the content of a previously sent text-like message using m.replace. Mentions are intentionally not repeated by edits.
  fields:
    account:
      name: Account
      selector:
        text:
    room:
      name: Room
      selector:
        text:
    event_id:
      name: Event ID
      required: true
      selector:
        text:
    message:
      name: New message
      required: true
      selector:
        text:
          multiline: true
    msgtype:
      name: Message type
      default: text
      selector:
        select:
          options: [text, notice, emote]
    format:
      name: Format
      default: text
      selector:
        select:
          options: [text, html, markdown]

redact:
  name: Redact Matrix event
  description: Redact an event from a Matrix room.
  fields:
    account:
      name: Account
      selector:
        text:
    room:
      name: Room
      selector:
        text:
    event_id:
      name: Event ID
      required: true
      selector:
        text:
    reason:
      name: Reason
      selector:
        text:

purge_media:
  name: Purge downloaded Matrix media
  description: Delete downloaded incoming media files for one Matrix Extended account. Returns removed_files and removed_bytes when response data is requested.
  fields:
    account:
      name: Account
      description: Config entry ID. Omit when only one Matrix Extended account is loaded.
      selector:
        text:
